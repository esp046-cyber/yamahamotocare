<!doctype html>
<html lang="en" data-app-version="2026.5.0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <title>MotoCare PH — Precision Motorcycle Telemetry &amp; Garage OS</title>
  <meta name="description" content="Next-gen offline maintenance diagnostics, torque telemetry, and authentic OEM parts catalog for Yamaha and Honda riders in the Philippines.">
  <meta name="theme-color" content="#060B19" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F1F5F9" media="(prefers-color-scheme: light)">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.ico" sizes="any">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MotoCare PH">
  <meta property="og:title" content="MotoCare PH — Yamaha &amp; Honda Telemetry &amp; Torque Suite">
  <meta property="og:description" content="Authentic service specifications, parts catalog cross-references, and factory torque specs for Philippine scooters, underbones, and sport bikes.">
  <meta property="og:image" content="icons/og-image.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MotoCare PH">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <script>
    (function(){
      try {
        var s = JSON.parse(localStorage.getItem('motocare.v3'));
        var t = s && s.theme;
        if (t && t !== 'auto') {
          document.documentElement.dataset.theme = t;
        } else {
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        }
      } catch(e){}
    })();
  </script>

  <!-- External Clean Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <a href="#garage" class="brand-cluster" aria-label="MotoCare PH Home">
      <svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="headerCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00E5FF"/>
            <stop offset="100%" stop-color="#0066FF"/>
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="28" fill="rgba(0, 229, 255, 0.06)" stroke="url(#headerCyanGrad)" stroke-width="2.5"/>
        <path d="M32 50V32M20 18v10a12 12 0 0 0 24 0V18" fill="none" stroke="url(#headerCyanGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="32" cy="32" r="4" fill="#00E5FF"/>
      </svg>
      <div class="brand-titles">
        <h1>MotoCare PH <span class="brand-tag">2026 Fleet</span></h1>
      </div>
    </a>
    
    <div class="header-actions">
      <button id="th" class="hud-btn" aria-label="Toggle theme">Theme: auto</button>
    </div>
  </header>

  <main id="view" tabindex="-1" role="region" aria-live="polite"></main>

  <nav aria-label="Primary Navigation">
    <div class="nav-inner"></div>
  </nav>

  <dialog id="dlg" aria-labelledby="dt">
    <h2 id="dt">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Add Motorcycle
    </h2>
    
    <label for="dm">Manufacturer &amp; Model Line</label>
    <select id="dm" required></select>

    <label for="dn">Nickname / Plate (Optional)</label>
    <input id="dn" type="text" maxlength="30" placeholder="e.g. Daily Commuter, Project X">

    <label for="do">Current Odometer (km)</label>
    <input id="do" type="number" inputmode="numeric" min="0" value="0">

    <div class="modal-actions">
      <button id="dc" type="button" class="hud-btn">Cancel</button>
      <button id="da" type="button" class="pri">Register Bike</button>
    </div>
  </dialog>

  <noscript>
    <div style="max-width:500px;margin:40px auto;padding:24px;border-radius:16px;background:#101B33;color:#F8FAFC;text-align:center;">
      <h2>JavaScript Required</h2>
      <p style="color:#8E9DB8;margin-top:8px;">MotoCare PH requires JavaScript. Please enable it in Safari.</p>
    </div>
  </noscript>

  <script src="js/db.js"></script>
  <script src="js/db_honda.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
